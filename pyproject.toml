[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'tku-venue-booking'
version = '0.1.0'
description = '淡江大學場地預約系統'
requires-python = '>=3.14'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.32',
    'jinja2>=3.1',
    'python-multipart>=0.0.18',
    'itsdangerous>=2.2',
    'sqlalchemy>=2.0',
    'alembic>=1.14',
    'pydantic>=2.12',
    'pydantic-settings>=2.6',
    'argon2-cffi>=23.1',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.3',
    'pytest-cov>=6.0',
    'httpx>=0.28',
    'ruff>=0.17',
    'mypy>=2.0',
    'pre-commit>=4.0',
    'pip-audit>=2.7',
    'pip-tools>=7.4',
]

[tool.setuptools.packages.find]
include = ['app*']

# ---------- ruff ----------
[tool.ruff]
target-version = 'py314'
line-length = 140
indent-width = 4
extend-exclude = ['migrations/versions']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'lf'

[tool.ruff.lint]
select = [
    'E',    # pycodestyle error
    'W',    # pycodestyle warning
    'F',    # pyflakes
    'I',    # isort
    'N',    # pep8-naming
    'UP',   # pyupgrade
    'B',    # flake8-bugbear
    'S',    # flake8-bandit（資安）
    'ANN',  # Type Hints
    'SIM',  # 簡化
    'PT',   # pytest 風格
    'DTZ',  # 禁止 naive datetime
    'PTH',  # 使用 pathlib
    'RUF',
]
# W191（tab 縮排）由 formatter 處理，避免與 formatter 衝突
ignore = ['W191']

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的相依注入寫法
extend-immutable-calls = ['fastapi.Depends', 'fastapi.Query', 'fastapi.Path', 'fastapi.Body', 'fastapi.Form', 'fastapi.Header', 'fastapi.Cookie']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'S105', 'S106', 'ANN']

# ---------- mypy ----------
[tool.mypy]
python_version = '3.14'
strict = true
plugins = ['pydantic.mypy']
exclude = ['migrations/']

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80'

[tool.coverage.run]
branch = true
source = ['app']
omit = ['migrations/*']

[tool.coverage.report]
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError']
