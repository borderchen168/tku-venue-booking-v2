[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'tku-venue-booking'
version = '0.1.0'
description = '淡江大學場地預約系統'
requires-python = '>=3.14'
dependencies = [
    # 鎖定 minor：T-023 的 LimitedFormRoute 與 route 覆蓋測試依賴 0.162 的 routing 行為（overview.md 第 9 節）
    'fastapi>=0.162,<0.163',
    'uvicorn[standard]>=0.32',
    'jinja2>=3.1',
    'python-multipart>=0.0.18',
    # 鎖上限避免 2.2 行為變更（ADR-003，overview.md 第 9 節）
    'sqlalchemy>=2.0,<2.2',
    'alembic>=1.14',
    'pydantic>=2.12',
    'pydantic-settings>=2.6',
    'argon2-cffi>=23.1',
    # Windows 沒有系統 IANA 時區資料，ZoneInfo 需要（ADR-004）
    'tzdata>=2024.1',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.3',
    'pytest-cov>=6.0',
    # Starlette 1.10 的 TestClient 以 httpx2 取代 httpx（httpx 已標示 deprecated）
    'httpx2>=2.16',
    'ruff>=0.17',
    'mypy>=2.0',
    'pre-commit>=4.0',
    'pip-audit>=2.7',
    'pip-tools>=7.4',
]

[tool.setuptools.packages.find]
include = ['app*']

# ---------- ruff ----------
[tool.ruff]
target-version = 'py314'
line-length = 140
indent-width = 4
# Markdown 內的程式碼區塊為設計文件的簽章示意（含對齊註解與 `...`），不交給 ruff 檢查或格式化
extend-exclude = ['migrations/versions', '*.md']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'lf'

[tool.ruff.lint]
select = [
    'E',    # pycodestyle error
    'W',    # pycodestyle warning
    'F',    # pyflakes
    'I',    # isort
    'N',    # pep8-naming
    'UP',   # pyupgrade
    'B',    # flake8-bugbear
    'S',    # flake8-bandit（資安）
    'ANN',  # Type Hints
    'SIM',  # 簡化
    'PT',   # pytest 風格
    'DTZ',  # 禁止 naive datetime
    'PTH',  # 使用 pathlib
    'RUF',
]
# W191（tab 縮排）由 formatter 處理，避免與 formatter 衝突
ignore = ['W191']
# 繁體中文註解與訊息使用全形標點（AGENTS.md 第 0 節），不視為易混淆字元（RUF001～RUF003）
allowed-confusables = ['，', '；', '：', '（', '）', '＋', '＝', '～', '！', '？']

[tool.ruff.lint.pep8-naming]
# 設計文件（error-handling.md 第 2 節）指定的例外類別名稱，不加 Error 字尾（N818）
ignore-names = ['FieldErrors', 'LoginRequired']

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的相依注入寫法
extend-immutable-calls = ['fastapi.Depends', 'fastapi.Query', 'fastapi.Path', 'fastapi.Body', 'fastapi.Form', 'fastapi.Header', 'fastapi.Cookie']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'S105', 'S106', 'ANN']
# 維運腳本以 shutil.which 取得 gh 絕對路徑、參數為固定清單且不使用 shell=True（AGENTS.md 2.3），請在受信任的目錄執行
# gh API 回傳的 JSON 結構不固定，GitHub 包裝函式以 Any 表示（ANN401）
# 逐檔列出以縮小例外範圍；新增 scripts/ 下的腳本時，確認符合上述條件後再加入
'scripts/migrate_backlog.py' = ['S603', 'ANN401']
'scripts/set_status.py' = ['S603', 'ANN401']

# ---------- mypy ----------
[tool.mypy]
python_version = '3.14'
strict = true
plugins = ['pydantic.mypy']
exclude = ['migrations/']

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80'
# 交易設定未生效等 SQLAlchemy 警告直接使測試失敗（ADR-003）
filterwarnings = ['error::sqlalchemy.exc.SAWarning']

[tool.coverage.run]
branch = true
source = ['app']
omit = ['migrations/*']

[tool.coverage.report]
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError']
