name: Epic(史詩)
description: 一組相關的 Story，對應一個較大的產品目標
title: '[EP-000] '
labels: ['type:epic']
body:
  - type: markdown
    attributes:
      value: |
        標題前綴請改為下一個 Epic 編號（GitHub 上現有最大編號 +1）。Priority 請在 Project 設定。
        Story 建立後以 sub-issue 掛到此 Epic 底下。
  - type: textarea
    id: goal
    attributes:
      label: 目標
      description: 這個 Epic 要解決什麼問題、帶來什麼價值
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 範圍
      value: |
        - 包含：
        - 不包含：
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: 成功指標
      value: '- '
